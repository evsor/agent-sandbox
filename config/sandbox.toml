# The sandbox spec

name = "claude-sandbox"
image = "claude-code-msb" # tag is git short SHA
cpus = 6
memory_mib = 12288    # 12 GiB
root_disk_mib = 16384 # 16 GiB
user = "node"
workdir = "/workspace"
shell = "/bin/bash"
security = "restricted"
# A placeholder, not a credential: the network gateway swaps it for the real token in requests to GitHub
env = ["GH_TOKEN=SBX-GITHUB-PAT-PLACEHOLDER"]

[[volumes]]
name = "claude-workspace"
target = "/workspace"
kind = "disk"
size_mib = 20480 # 20 GiB
nosuid = true
nodev = true

[[volumes]]
name = "claude-state"
target = "/home/node/claude-state"
kind = "disk"
size_mib = 5120 # 5 GiB
nosuid = true
nodev = true

[network]
default_egress = "deny"
default_ingress = "deny"
strict = true        # SNI/Host must match the allowed name
intercept_tls = true # hostname allows over HTTPS work only with TLS interception

# Rules match in order, first match wins: denies first. No rule may have destination "host" (the gateway):
# allowing it opens the host and forwards any DNS name upstream; denying it breaks name resolution.
[[network.rules]]
action = "deny"
direction = "egress"
destination = "private"

[[network.rules]]
action = "deny"
direction = "egress"
destination = "loopback"

[[network.rules]]
action = "deny"
direction = "egress"
destination = "link-local"

[[network.rules]]
action = "deny"
direction = "egress"
destination = "metadata"

[[network.rules]]
action = "deny"
direction = "egress"
destination = "multicast"

# Claude API, also the WebFetch safety check (Claude Code network docs)
[[network.rules]]
action = "allow"
direction = "egress"
destination = "api.anthropic.com"
protocol = "tcp"
port = "443"

# Subscription login (Claude Code network docs)
[[network.rules]]
action = "allow"
direction = "egress"
destination = "claude.ai"
protocol = "tcp"
port = "443"

# OAuth token exchange and refresh, and the API docs (Claude Code network docs)
[[network.rules]]
action = "allow"
direction = "egress"
destination = "platform.claude.com"
protocol = "tcp"
port = "443"

# Claude Code docs lookups (Claude Code network docs)
[[network.rules]]
action = "allow"
direction = "egress"
destination = "code.claude.com"
protocol = "tcp"
port = "443"

# Git over HTTPS, reached with the read-only token (GitHub docs)
[[network.rules]]
action = "allow"
direction = "egress"
destination = "github.com"
protocol = "tcp"
port = "443"

# gh and the REST API, reached with the read-only token (GitHub docs)
[[network.rules]]
action = "allow"
direction = "egress"
destination = "api.github.com"
protocol = "tcp"
port = "443"

# Archive downloads, where github.com redirects them (GitHub docs)
[[network.rules]]
action = "allow"
direction = "egress"
destination = "codeload.github.com"
protocol = "tcp"
port = "443"

# Downloads GitHub serves from another host (the domain list at api.github.com/meta)
[[network.rules]]
action = "allow"
direction = "egress"
destination = "objects.githubusercontent.com"
protocol = "tcp"
port = "443"

# Actions run logs for gh run view, where api.github.com redirects them (seen by following the redirect)
[[network.rules]]
action = "allow"
direction = "egress"
destination = "results-receiver.actions.githubusercontent.com"
protocol = "tcp"
port = "443"

# npm packages (npm docs)
[[network.rules]]
action = "allow"
direction = "egress"
destination = "registry.npmjs.org"
protocol = "tcp"
port = "443"

# Python package index (PyPI docs)
[[network.rules]]
action = "allow"
direction = "egress"
destination = "pypi.org"
protocol = "tcp"
port = "443"

# Python package downloads (PyPI docs)
[[network.rules]]
action = "allow"
direction = "egress"
destination = "files.pythonhosted.org"
protocol = "tcp"
port = "443"

# The read-only GitHub token. Its value comes from this variable in sbx's environment and never enters the guest.
[[secrets]]
name = "GITHUB_PAT"
allow = ["github.com", "api.github.com"]
placeholder = "SBX-GITHUB-PAT-PLACEHOLDER"
header_fields = ["authorization"]
violation_action = "block-and-log"
